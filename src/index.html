    :root{
      --canvas:#FFF1FA; --surface:#FFF9FD; --white:#FFFFFF; --ink:#4B3869;
      --primary:#FF9BCB; --primary-deep:#D767A5; --highlight:#9BDCF4;

      --shadow: 0 8px 0 rgba(116,77,136,.14);

    *{box-sizing:border-box}

    .app:before,.app:after{content:&quot;&quot;;position:absolute;border:3px solid rgba(155,220,244,.62);border-radius:50%;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,155,203,.28))}
    .app:before{width:190px;height:190px;right:-70px;top:105px;box-shadow:-34px 56px 0 -86px #FF9BCB, -90px 154px 0 -88px #9BDCF4}.app:after{width:120px;height:120px;left:-58px;bottom:80px;box-shadow:150px -38px 0 -55px #FFD36E, 196px -82px 0 -57px #B9A7F5}
    .topbar{position:relative;z-index:1;max-width:1640px;margin:0 auto 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .brand{display:flex;gap:16px;align-items:center}.brand-mark{width:58px;height:58px;border-radius:50%;background:var(--primary);border:4px solid var(--primary-deep);display:grid;place-items:center;position:relative;box-shadow:var(--shadow)}
    .brand-mark:before,.brand-mark:after{content:&quot;&quot;;position:absolute;border:2px solid #000;border-radius:50%;width:28px;height:28px}.brand-mark:after{width:10px;height:10px;background:#000;border:none}
    h1{font-size:clamp(24px,3.1vw,42px);margin:0;letter-spacing:.04em;line-height:1.08}.subtitle{margin:7px 0 0;color:var(--muted);font-size:clamp(13px,1.4vw,18px)}
    .top-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.mini-badge{background:var(--white);border:1px solid var(--border);padding:9px 12px;font-size:13px;box-shadow:var(--shadow)}
    .view{position:relative;z-index:1;max-width:1640px;margin:0 auto}.screen{display:none}.screen.active{display:block}
    .intro-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:stretch}.panel{background:var(--surface);border:2px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:22px;position:relative}.panel:before{content:&quot;&quot;;position:absolute;right:20px;top:15px;width:10px;height:10px;background:#FFD36E;transform:rotate(45deg);box-shadow:18px 9px 0 #B9A7F5,36px -4px 0 #9BDCF4;opacity:.9}
    .hero{min-height:475px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.hero h2{font-size:clamp(30px,4.7vw,70px);margin:0 0 14px;line-height:1.05}.hero h2 span{color:var(--primary-deep)}.hero p{font-size:clamp(16px,1.7vw,24px);line-height:1.65;margin:0 0 22px;max-width:760px}.hero-graphic{position:absolute;right:6%;bottom:-40px;width:245px;height:245px;border:16px solid rgba(166,207,239,.75);border-radius:50%;transform:rotate(13deg)}.hero-graphic:before{content:&quot;&quot;;position:absolute;inset:35px;border:10px solid var(--primary);border-radius:50%}.hero-graphic:after{content:&quot;&quot;;position:absolute;width:26px;height:26px;border-radius:50%;background:var(--primary-deep);right:56px;top:30px;box-shadow:-120px 102px 0 var(--blue1),-58px 142px 0 var(--highlight)}
    .rules{display:grid;gap:11px;margin:18px 0}.rule{display:flex;gap:11px;align-items:flex-start;border-left:5px solid var(--highlight);padding:10px 12px;background:rgba(255,255,255,.58);font-size:15px;line-height:1.45}.rule strong{color:var(--primary-deep)}
    .start-zone{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.primary-btn,.secondary-btn,.difficulty-btn{border:2px solid var(--primary-deep);border-radius:16px;min-height:48px;padding:10px 18px;cursor:pointer;transition:.18s transform,.18s background,.18s color}.primary-btn{background:var(--primary);color:#4B3869;box-shadow:4px 4px 0 rgba(116,77,136,.16);font-weight:800}.primary-btn:hover,.secondary-btn:hover,.difficulty-btn:hover{transform:translateY(-2px) rotate(-.5deg)}.secondary-btn,.difficulty-btn{background:var(--white);border-color:var(--border)}.secondary-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary-btn:focus-visible,.secondary-btn:focus-visible,.difficulty-btn:focus-visible,.answer-btn:focus-visible{outline:3px solid var(--highlight);outline-offset:2px}
    .level-list{display:grid;gap:12px}.level-title{font-size:20px;margin:0 0 8px}.level-card{border:1px solid var(--border);background:var(--white);padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.level-card.active-level{border-left:7px solid var(--primary)}.level-card.locked{opacity:.55}.level-name{font-weight:800;font-size:18px}.level-desc{font-size:13px;color:var(--muted);margin-top:5px}.level-tag{font-size:12px;color:var(--positive);border:1px solid var(--highlight);padding:5px 8px;white-space:nowrap}
    .game-head{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1.4fr) auto auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px}.head-stat{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head-stat strong{font-size:18px}.progress-wrap{min-width:260px;text-align:center}.progress-label{font-size:13px;color:var(--muted);margin-bottom:5px}.progress-track{height:10px;background:#fff;border:1px solid var(--border);position:relative;overflow:hidden}.progress-fill{height:100%;background:var(--primary);width:0;transition:width .3s}.timer-box{text-align:right}.timer{font-size:34px;font-weight:900;line-height:1}.timer.warning{color:var(--attention);animation:pulse .75s infinite alternate}.timer-note{font-size:12px;color:var(--muted);margin-top:4px}.pause-btn{min-height:44px;padding:8px 15px;border:2px solid #8A6BC2;border-radius:14px;background:#E7D8FF;color:#4B3869;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 rgba(116,77,136,.14)}.pause-btn:hover:not(:disabled){transform:translateY(-2px)}.pause-btn:disabled{opacity:.58;cursor:not-allowed}.fairy-ribbon{height:8px;margin-top:12px;background:linear-gradient(90deg,#FF9BCB,#FFD36E,#9BDCF4,#B9A7F5,#FF9BCB);border-radius:99px;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
    @keyframes pulse{to{transform:scale(1.08)}}

 &lt;div id=&quot;pauseOverlay&quot; class=&quot;modal-backdrop&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;pauseTitle&quot;&gt;&lt;div class=&quot;modal pause-modal&quot;&gt;&lt;h3 id=&quot;pauseTitle&quot;&gt;魔法时间暂停&lt;/h3&gt;&lt;p&gt;倒计时已经停住，三位同学可以整理思路。准备好后点击继续，剩余时间会从刚才的位置接着走。&lt;/p&gt;&lt;div class=&quot;fairy-ribbon&quot;&gt;&lt;/div&gt;&lt;button id=&quot;resumeBtn&quot; class=&quot;primary-btn&quot; type=&quot;button&quot; style=&quot;margin-top:18px&quot; tabindex=&quot;0&quot;&gt;继续游戏&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const PI = {1:3.14,2:6.28,3:9.42,4:12.56,5:15.70,6:18.84,7:21.98,8:25.12,9:28.26,10:31.40,11:34.54,12:37.68,16:50.24,18:56.52,20:62.80,25:78.50,32:100.48,36:113.04,49:153.86,64:200.96,81:254.34,121:379.94};
  const SQUARE = {}; for(let i=1;i&lt;=20;i++) SQUARE[i]=i*i;
  const CUBE = {}; for(let i=1;i&lt;=20;i++) CUBE[i]=i*i*i;
  const AREA_PI = {}; for(let i=1;i&lt;=20;i++) AREA_PI[i]=Number((i*i*3.14).toFixed(2));
  const piKeys = Object.keys(PI).map(Number), squareKeys=Object.keys(SQUARE).map(Number), areaKeys=Object.keys(AREA_PI).map(Number), cubeKeys=Object.keys(CUBE).map(Number);
  const players = [{name:'一号选手',score:0,totalTime:0,lastTime:null,answered:false,correct:0,rewardLevel:0},{name:'二号选手',score:0,totalTime:0,lastTime:null,answered:false,correct:0,rewardLevel:0},{name:'三号选手',score:0,totalTime:0,lastTime:null,answered:false,correct:0,rewardLevel:0}];
  const difficultyNames={1:'基础识记',2:'判断辨析',3:'4&times;4魔法连连看'};
  const state={phase:'intro',level:1,questionIndex:0,questions:[],playerQuestions:[[],[],[]],optionOrders:[[],[],[]],startedAt:0,timeLeft:15,timerId:null,advanceId:null,roundScores:[0,0,0],unlocked:1,seed:Date.now(),matchBoards:[]};

  const $ = id =&gt; document.getElementById(id);
  const introScreen=$('introScreen'), gameScreen=$('gameScreen'), resultScreen=$('resultScreen');
  const playersEl=$('players');
  const clamp=(n,min,max)=&gt;Math.max(min,Math.min(max,n));
  function hashSeed(str){let h=2166136261;for(let i=0;i&lt;str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h&gt;&gt;&gt;0}
  function rng(seed){let x=seed&gt;&gt;&gt;0;return()=&gt;{x=Math.imul(1664525,x)+1013904223;return (x&gt;&gt;&gt;0)/4294967296}}
  function shuffled(list,random){const a=list.slice();for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function pick(arr,random){return arr[Math.floor(random()*arr.length)]}
  function fmt(n){return Number(n).toFixed(2)}
  function formula(text){return `\\(${text}\\)`}
  function normalDistractors(correct, source, random, count=3){const set=new Set([String(correct)]);const candidates=[];for(const x of source){if(String(x)!==String(correct)) candidates.push(x)}for(const x of shuffled(candidates,random)){if(set.size&gt;=count+1)break;set.add(String(x))}return Array.from(set).slice(0,count+1)}
  function choiceQuestion(text,answer,options,tip,level,tag){return {type:'choice',text,answer:String(answer),options:options.map(String),tip,level,tag}}
  function getTimeLimit(level){return level===3?60:15}
  function buildMatchCards(random,playerIndex=0){const groups=[{pair:'pi4',items:[formula('4\\pi'),'12.56']},{pair:'sq5',items:[formula('5^2'),'25']},{pair:'area5',items:[formula('5^2\\pi'),'78.50']},{pair:'circ',items:[formula('C=2\\pi r'),'圆的周长']},{pair:'area',items:[formula('S=\\pi r^2'),'圆的面积']},{pair:'pi2',items:[formula('2\\pi'),'6.28']},{pair:'sq10',items:[formula('10^2'),'100']},{pair:'pi10',items:[formula('10\\pi'),'31.40']},{pair:'pi3',items:[formula('3\\pi'),'9.42']},{pair:'sq4',items:[formula('4^2'),'16']},{pair:'area4',items:[formula('4^2\\pi'),'50.24']},{pair:'pi5',items:[formula('5\\pi'),'15.70']}];const ordered=shuffled(groups,random),start=(playerIndex*3)%ordered.length,selected=[];for(let i=0;i&lt;8;i++)selected.push(ordered[(start+i)%ordered.length]);return shuffled(selected.flatMap(group=&gt;group.items.map(display=&gt;({pair:group.pair,display}))),random).map((card,index)=&gt;({...card,id:`p${playerIndex}m${index}`}))}
  function setupMatchBoards(){state.matchBoards=players.map((_,i)=&gt;{const random=rng(hashSeed(`${state.seed}-match-${i}-${Date.now()}`));return {cards:buildMatchCards(random,i),selected:[],matched:[],pairCount:0,wrongTimer:null,complete:false,resolving:false}});}
  function judgeQuestion(text,answer,tip,level,tag,correctStatement){return {type:'judge',text,answer:String(answer),options:['正确','错误'],tip,level,tag,correctStatement}}
  function buildQuestionBank(){
    const bank=[[],[],[],[]]; const random=rng(hashSeed('circle-memory-bank-v1'));
    // Level 1: 34 direct memory questions.
    for(let i=0;i&lt;12;i++){const r=piKeys[i%piKeys.length], val=Number((2*r*3.14).toFixed(2)); const circumferenceSource=piKeys.map(n=&gt;Number((2*n*3.14).toFixed(2))); const opts=normalDistractors(val,circumferenceSource,random,3); bank[1].push(choiceQuestion(`已知半径为 ${formula('r='+r)}，对应的 ${formula('2\\pi r')} 数值是？`,val,opts,`圆的周长公式是 ${formula('C=2\\pi r')}。当 ${formula('r='+r)} 时，${formula('C=2\\pi\\times '+r+'='+fmt(val))}。`,1,'pi'))}
    for(let i=0;i&lt;10;i++){const n=(i%20)+1,val=SQUARE[n];const opts=normalDistractors(val,Object.values(SQUARE),random,3);bank[1].push(choiceQuestion(`${formula(n+'^2')} 的结果是？`,val,opts,`完全平方数表示相同数相乘：${formula(n+'^2='+n+'\\times '+n+'='+val)}。`,1,'square'))}
    for(let i=0;i&lt;12;i++){const r=(i%20)+1,val=AREA_PI[r];const opts=normalDistractors(val,Object.values(AREA_PI),random,3);bank[1].push(choiceQuestion(`圆的半径是 ${formula('r='+r)}，这个圆的面积约是多少？（&pi; 取 3.14）`,val,opts,`圆面积公式是 ${formula('S=\\pi r^2')}，所以 ${formula('S='+r+'^2\\pi='+fmt(val))}。`,1,'area'))}
    const formulaQuestions=[
      {text:`圆的周长公式是？`,answer:'C=2\\pi r',options:['C=2\\pi r','C=\\pi r^2','C=\\pi d^2','C=r^2'],tip:`圆的周长可以用半径表示为 ${formula('C=2\\pi r')}。`,tag:'formula'},
      {text:`如果已知圆的直径，圆的周长公式应选哪一个？`,answer:'C=\\pi d',options:['C=\\pi d','C=2\\pi r^2','C=d^2','C=\\pi r'],tip:`知道直径时，圆周长公式是 ${formula('C=\\pi d')}；知道半径时才常写成 ${formula('C=2\\pi r')}。`,tag:'formula'},
      {text:`圆的面积公式是？`,answer:'S=\\pi r^2',options:['S=\\pi r^2','S=2\\pi r','S=\\pi d','S=r^2'],tip:`圆面积要用半径的平方乘圆周率：${formula('S=\\pi r^2')}。`,tag:'formula'}
    ];
    formulaQuestions.forEach(item=&gt;bank[1].push({...choiceQuestion(item.text,item.answer,item.options,item.tip,1,item.tag),mathOptions:true}));
    // Level 2: 33 judgement questions.
    for(let i=0;i&lt;11;i++){const r=piKeys[(i+5)%piKeys.length],val=PI[r],truth=i%2===0;const shown=truth?val:(val+(i%3+1)*0.02);bank[2].push(judgeQuestion(`${formula(r+'\\pi')} 是否等于 ${formula(fmt(shown))}？`,truth?'正确':'错误',`圆周率倍数表中的对应项是 ${formula(r+'\\pi='+fmt(val))}。小数点后两位要看清楚。`,2,'pi',truth?`正确：${formula(r+'\\pi='+fmt(val))}`:`错误：应为 ${formula(r+'\\pi='+fmt(val))}`))}
    for(let i=0;i&lt;11;i++){const n=(i+4)%20+1,val=SQUARE[n],truth=i%2===1;const shown=truth?val:val+(i%3+1);bank[2].push(judgeQuestion(`${formula(n+'^2')} 是否等于 ${formula(String(shown))}？`,truth?'正确':'错误',`完全平方数要用 ${formula(n+'\\times '+n)} 核对。${formula(n+'^2='+val)}。`,2,'square',truth?`正确：${formula(n+'^2='+val)}`:`错误：应为 ${formula(n+'^2='+val)}`))}
    for(let i=0;i&lt;11;i++){const r=(i+1)%20+1,val=AREA_PI[r],truth=i%2===0;const shown=truth?val:val+(i%3+1)*3.14;bank[2].push(judgeQuestion(`半径为 ${formula('r='+r)} 的圆，面积 ${formula('S')} 是否为 ${formula(fmt(shown))}？`,truth?'正确':'错误',`使用 ${formula('S=\\pi r^2')}，查表可得 ${formula(r+'^2\\pi='+fmt(val))}。`,2,'area',truth?`正确：${formula('S='+fmt(val))}`:`错误：应为 ${formula('S='+fmt(val))}`))}
