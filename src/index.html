<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分数乘法算理演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F0F9FF;
    overflow: hidden;
    touch-action: none;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* 顶栏 */
  .header {
    flex: 0 0 auto;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 3px solid #DBEAFE;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #FACC15, #F97316);
    display: grid; place-items: center;
    font-size: 22px;
    box-shadow: 0 6px 14px rgba(249,115,22,0.25);
    transform: rotate(3deg);
  }
  .brand h1 { font-size: 22px; color: #2563EB; font-weight: 800; letter-spacing: .3px; }
  .brand p { font-size: 12px; color: #60A5FA; font-weight: 500; margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 20px; }
  .formula-display { font-size: 24px; color: #374151; display: flex; align-items: center; gap: 6px; font-weight: 600; }

  .audio-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .2s;
  }
  .audio-btn:hover { background: #F3F4F6; }
  .audio-btn svg { width: 22px; height: 22px; stroke: #4B5563; }

  /* 主区 */
  .main { flex: 1 1 auto; display: flex; position: relative; overflow: hidden; min-height: 0; }

  /* 侧栏 */
  .sidebar {
    flex: 0 0 290px;
    margin: 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    padding: 18px;
    gap: 20px;
    overflow-y: auto;
    z-index: 100;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #CFE0D8; border-radius: 3px; }

  .panel-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 800;
    margin-bottom: 12px;
  }
  .panel-title .bar { width: 5px; height: 18px; border-radius: 3px; }
  .panel-title.blue { color: #3B82F6; }
  .panel-title.blue .bar { background: #60A5FA; }
  .panel-title.orange { color: #FB923C; }
  .panel-title.orange .bar { background: #FB923C; }

  .frac-inputs {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    padding: 14px 14px;
    border-radius: 18px;
    border: 2px solid #EFF6FF;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    gap: 6px;
  }
  .frac-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .frac-group input {
    width: 60px; height: 38px;
    text-align: center;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 800;
    outline: none;
    font-family: inherit;
    -moz-appearance: textfield;
    transition: background .2s, box-shadow .2s;
  }
  .frac-group input::-webkit-inner-spin-button,
  .frac-group input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .frac-group input.blue { background: #EFF6FF; color: #2563EB; }
  .frac-group input.green { background: #ECFDF5; color: #059669; }
  .frac-group input:focus { box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
  .frac-group input.green:focus { box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
  .frac-divider { width: 58px; height: 2px; border-radius: 2px; }
  .frac-divider.blue { background: #BFDBFE; }
  .frac-divider.green { background: #A7F3D0; }
  .mul-sign { font-size: 24px; font-weight: 800; color: #FB923C; flex: 0 0 auto; }

  .range-hint {
    font-size: 11px;
    color: #9CA3AF;
    text-align: center;
    margin-top: 8px;
    letter-spacing: .3px;
  }

  .reset-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 12px;
    box-shadow: 0 8px 18px rgba(37,99,235,0.25);
    transition: transform .15s;
    font-family: inherit;
  }
  .reset-btn:hover { transform: translateY(-1px); }
  .reset-btn:active { transform: scale(0.97); }

  .step-list { display: flex; flex-direction: column; gap: 8px; }
  .step-btn {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all .2s;
    font-family: inherit;
  }
  .step-btn:hover { background: #fff; }
  .step-btn.active {
    background: #EFF6FF;
    border-color: #BFDBFE;
    box-shadow: 0 4px 12px rgba(59,130,246,0.12);
  }
  .step-badge {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #E5E7EB;
    color: #374151;
    font-size: 13px;
    font-weight: 800;
    display: grid; place-items: center;
    flex: 0 0 auto;
    transition: all .2s;
  }
  .step-btn.active .step-badge { background: #3B82F6; color: #fff; }
  .step-btn .label { font-size: 13px; font-weight: 600; color: #4B5563; }
  .step-btn.active .label { color: #1D4ED8; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: #9CA3AF;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .pen-colors {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .color-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid #fff;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: transform .15s;
  }
  .color-btn:hover { transform: scale(1.08); }
  .color-btn:active { transform: scale(0.9); }
  .color-btn.active { box-shadow: 0 0 0 3px rgba(59,130,246,0.4); }

  .clear-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #FEF2F2;
    color: #DC2626;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }
  .clear-btn:hover { background: #FEE2E2; }

  /* 画布 */
  .canvas-container {
    flex: 1 1 auto;
    position: relative;
    margin: 14px 14px 14px 0;
    border-radius: 24px;
    background: #FFFDF9;
    background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
    background-size: 30px 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    overflow: hidden;
    min-width: 0;
  }
  #animationCanvas { position: absolute; top: 0; left: 0; z-index: 10; }
  #drawingCanvas { position: absolute; top: 0; left: 0; z-index: 50; cursor: crosshair; }

  .hint-box {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 18px 32px;
    border-radius: 22px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.1);
    border: 2px solid #DBEAFE;
    opacity: 0;
    transition: all .5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 60;
    max-width: 82%;
  }
  .hint-box.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hint-box p {
    font-size: 17px;
    font-weight: 700;
    color: #1E40AF;
    text-align: center;
    line-height: 1.5;
  }

  /* 分数 */
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    line-height: 1;
    margin: 0 3px;
    font-family: 'Times New Roman', serif;
  }
  .frac .num { padding: 0 4px; }
  .frac .den { padding: 0 4px; border-top: 1.5px solid currentColor; }

  @media (max-width: 720px) {
    .sidebar { flex: 0 0 230px; margin: 10px; padding: 14px; }
    .header { padding: 0 16px; height: 64px; }
    .brand h1 { font-size: 18px; }
    .formula-display { font-size: 18px; }
    .canvas-container { margin: 10px 10px 10px 0; }
    .frac-group input { width: 50px; height: 34px; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-icon">🎨</div>
      <div>
        <h1>分数乘法大冒险</h1>
        <p>探索“部分中的部分”</p>
      </div>
    </div>
    <div class="header-right">
      <div class="formula-display" id="formulaDisplay"></div>
      <button class="audio-btn" id="audioBtn" title="播放/暂停背景音乐">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <section>
        <div class="panel-title blue"><span class="bar"></span>设置分数</div>
        <div class="frac-inputs">
          <div class="frac-group">
            <input type="number" id="num1" value="1" min="1" max="100" step="1" inputmode="numeric" class="blue">
            <div class="frac-divider blue"></div>
            <input type="number" id="den1" value="2" min="1" max="100" step="1" inputmode="numeric" class="blue">
          </div>
          <span class="mul-sign">×</span>
          <div class="frac-group">
            <input type="number" id="num2" value="1" min="1" max="100" step="1" inputmode="numeric" class="green">
            <div class="frac-divider green"></div>
            <input type="number" id="den2" value="4" min="1" max="100" step="1" inputmode="numeric" class="green">
          </div>
        </div>
        <div class="range-hint">分子 1–100 · 分母 1–100</div>
        <button class="reset-btn" id="resetBtn">开始探索</button>
      </section>

      <section>
        <div class="panel-title orange"><span class="bar"></span>演示步骤</div>
        <div class="step-list">
          <button class="step-btn" data-step="0">
            <span class="step-badge">1</span>
            <span class="label">建立单位“1”</span>
          </button>
          <button class="step-btn" data-step="1">
            <span class="step-badge">2</span>
            <span class="label">表示第一个分数</span>
          </button>
          <button class="step-btn" data-step="2">
            <span class="step-badge">3</span>
            <span class="label">表示第二个分数</span>
          </button>
          <button class="step-btn" data-step="3">
            <span class="step-badge">4</span>
            <span class="label">观察重叠部分</span>
          </button>
          <button class="step-btn" data-step="4">
            <span class="step-badge">5</span>
            <span class="label">总结计算方法</span>
          </button>
        </div>
      </section>

      <section>
        <div class="section-label">手写批注</div>
        <div class="pen-colors">
          <button class="color-btn active" style="background:#1F2937" data-color="#1F2937" title="黑色"></button>
          <button class="color-btn" style="background:#DC2626" data-color="#DC2626" title="红色"></button>
          <button class="color-btn" style="background:#3B82F6" data-color="#3B82F6" title="蓝色"></button>
          <button class="color-btn" style="background:#10B981" data-color="#10B981" title="绿色"></button>
        </div>
        <button class="clear-btn" id="clearBtn">清除批注</button>
      </section>
    </aside>

    <div class="canvas-container">
      <canvas id="animationCanvas"></canvas>
      <canvas id="drawingCanvas"></canvas>
      <div class="hint-box" id="hintBox"><p></p></div>
    </div>
  </main>
</div>

<audio id="bgAudio" src="https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/WsnyDUstKQc8wC2TckUj2T.mp3" loop></audio>

<script>
(function () {
  var animCanvas = document.getElementById('animationCanvas');
  var drawCanvas = document.getElementById('drawingCanvas');
  var animCtx = animCanvas.getContext('2d');
  var drawCtx = drawCanvas.getContext('2d');
  var hintBox = document.getElementById('hintBox');
  var audio = document.getElementById('bgAudio');
  var formulaDisplay = document.getElementById('formulaDisplay');

  var MIN_NUM = 1, MAX_NUM = 100;
  var MIN_DEN = 1, MAX_DEN = 100;

  var state = {
    n1: 1, d1: 2,
    n2: 1, d2: 4,
    currentStep: -1,
    penColor: '#1F2937',
    isDrawing: false,
    rect: { x: 0, y: 0, w: 0, h: 0 },
    progress1: 0,
    progress2: 0
  };

  /* ============================================================
     输入限制：分子 1-100，分母 1-100
     ============================================================ */
  function bindFractionInput(input, min, max, defaultVal) {
    function clamp(raw) {
      if (raw === '') return '';
      raw = raw.replace(/^0+(?=\d)/, '');
      var val = parseInt(raw, 10);
      if (isNaN(val)) return '';
      if (val > max) return String(max);
      if (val < min) return String(min);
      return String(val);
    }

    input.addEventListener('input', function () {
      var raw = input.value.replace(/[^\d]/g, '');
      var next = clamp(raw);
      if (next !== input.value) input.value = next;
    });

    input.addEventListener('blur', function () {
      if (input.value === '') { input.value = String(defaultVal); return; }
      var val = parseInt(input.value, 10);
      if (isNaN(val) || val < min) input.value = String(min);
      else if (val > max) input.value = String(max);
      else input.value = String(val);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        var v = parseInt(input.value, 10); if (isNaN(v)) v = defaultVal;
        input.value = String(Math.min(max, v + 1));
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        var v2 = parseInt(input.value, 10); if (isNaN(v2)) v2 = defaultVal;
        input.value = String(Math.max(min, v2 - 1));
      } else if (e.key.length === 1 && !/\d/.test(e.key)) {
        e.preventDefault();
      }
    });

    input.addEventListener('wheel', function (e) {
      e.preventDefault(); input.blur();
    }, { passive: false });

    input.addEventListener('paste', function (e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text') || '';
      var digits = text.replace(/[^\d]/g, '');
      if (digits === '') return;
      var val = parseInt(digits, 10);
      if (isNaN(val)) return;
      if (val < min) val = min;
      if (val > max) val = max;
      input.value = String(val);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
  }

  var num1El = document.getElementById('num1');
  var den1El = document.getElementById('den1');
  var num2El = document.getElementById('num2');
  var den2El = document.getElementById('den2');

  bindFractionInput(num1El, MIN_NUM, MAX_NUM, 1);
  bindFractionInput(den1El, MIN_DEN, MAX_DEN, 2);
  bindFractionInput(num2El, MIN_NUM, MAX_NUM, 1);
  bindFractionInput(den2El, MIN_DEN, MAX_DEN, 4);

  /* ---------- 分数 HTML ---------- */
  function fracHTML(n, d) {
    if (d === 1) return String(n);
    return '<span class="frac"><span class="num">' + n + '</span><span class="den">' + d + '</span></span>';
  }

  /* ---------- 自适应尺寸（4:3 标准长方形） ---------- */
  function resize() {
    var container = animCanvas.parentElement;
    var w = container.clientWidth;
    var h = container.clientHeight;
    animCanvas.width = w;
    animCanvas.height = h;
    drawCanvas.width = w;
    drawCanvas.height = h;

    /* 4:3 标准长方形，留出足够画布内边距 */
    var baseSize = Math.min(w / 1.35, h / 1.05) * 0.72;
    var rectW = baseSize * 1.2;
    var rectH = baseSize * 0.9;

    state.rect = {
      x: (w - rectW) / 2,
      y: (h - rectH) / 2 + 8,
      w: rectW,
      h: rectH
    };
    if (state.currentStep >= 0) renderStep(state.currentStep);
  }

  window.addEventListener('resize', resize);

  /* ---------- 手写批注 ---------- */
  function getPos(e) {
    var rect = drawCanvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function startDraw(e) {
    state.isDrawing = true;
    var p = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(p.x, p.y);
    drawCtx.strokeStyle = state.penColor;
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
  }
  function drawing(e) {
    if (!state.isDrawing) return;
    var p = getPos(e);
    drawCtx.lineTo(p.x, p.y);
    drawCtx.stroke();
  }
  function stopDraw() { state.isDrawing = false; }

  drawCanvas.addEventListener('mousedown', startDraw);
  drawCanvas.addEventListener('mousemove', drawing);
  window.addEventListener('mouseup', stopDraw);
  drawCanvas.addEventListener('touchstart', function (e) { e.preventDefault(); startDraw(e); }, { passive: false });
  drawCanvas.addEventListener('touchmove', function (e) { e.preventDefault(); drawing(e); }, { passive: false });
  drawCanvas.addEventListener('touchend', stopDraw);

  document.querySelectorAll('.color-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.penColor = btn.dataset.color;
      document.querySelectorAll('.color-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  });

  /* ============================================================
     绘制：标准直角长方形（无圆角）
     ============================================================ */
  function drawUnitSquare(opacity) {
    if (opacity === undefined) opacity = 1;
    var x = state.rect.x, y = state.rect.y, w = state.rect.w, h = state.rect.h;

    /* 先填充浅底色，再描边，四角为直角 */
    animCtx.setLineDash([]);
    animCtx.fillStyle = 'rgba(255,253,249,' + opacity + ')';
    animCtx.fillRect(x, y, w, h);

    /* 外框线加粗，更醒目 */
    animCtx.strokeStyle = '#60A5FA';
    animCtx.lineWidth = 5;
    animCtx.lineJoin = 'miter';
    animCtx.lineCap = 'butt';
    animCtx.strokeRect(x, y, w, h);

    animCtx.fillStyle = '#3B82F6';
    animCtx.font = 'bold 22px sans-serif';
    animCtx.textAlign = 'center';
    animCtx.fillText('✨ 单位 “1” ✨', x + w / 2, y - 26);
  }

  /* 分割线：份数多时调细、调浅，避免糊成一片 */
  function lineWidthFor(parts) {
    if (parts <= 12) return 2;
    if (parts <= 30) return 1.2;
    if (parts <= 60) return 0.8;
    return 0.5;
  }
  function lineAlphaFor(parts) {
    if (parts <= 12) return 1;
    if (parts <= 30) return 0.85;
    if (parts <= 60) return 0.7;
    return 0.55;
  }

  function drawFraction1(fillOpacity) {
    if (fillOpacity === undefined) fillOpacity = 0.6;
    var x = state.rect.x, y = state.rect.y, w = state.rect.w, h = state.rect.h;
    var partW = w / state.d1;
    var targetW = partW * state.n1;

    animCtx.fillStyle = 'rgba(59,130,246,' + fillOpacity + ')';
    animCtx.fillRect(x, y, targetW * state.progress1, h);

    if (state.d1 > 1) {
      animCtx.save();
      animCtx.strokeStyle = '#EF4444';
      animCtx.globalAlpha = lineAlphaFor(state.d1);
      animCtx.lineWidth = lineWidthFor(state.d1);
      for (var i = 1; i < state.d1; i++) {
        animCtx.beginPath();
        animCtx.moveTo(x + i * partW, y);
        animCtx.lineTo(x + i * partW, y + h);
        animCtx.stroke();
      }
      animCtx.restore();
    }

    var textX = x + targetW / 2;
    var textY = y - 44;
    animCtx.fillStyle = '#1E40AF';
    animCtx.font = '18px serif';
    animCtx.textAlign = 'center';
    animCtx.fillText(state.n1, textX, textY - 6);
    animCtx.beginPath();
    animCtx.strokeStyle = '#1E40AF';
    animCtx.lineWidth = 1.5;
    animCtx.moveTo(textX - 14, textY + 0);
    animCtx.lineTo(textX + 14, textY + 0);
    animCtx.stroke();
    animCtx.fillText(state.d1, textX, textY + 20);
  }

  function drawFraction2(fillOpacity) {
    if (fillOpacity === undefined) fillOpacity = 0.6;
    var x = state.rect.x, y = state.rect.y, w = state.rect.w, h = state.rect.h;
    var partH = h / state.d2;
    var fraction1W = (w / state.d1) * state.n1;
    var targetH = partH * state.n2;

    animCtx.fillStyle = 'rgba(16,185,129,' + fillOpacity + ')';
    animCtx.fillRect(x, y, fraction1W, targetH * state.progress2);

    if (state.d2 > 1) {
      animCtx.save();
      animCtx.strokeStyle = '#EF4444';
      animCtx.globalAlpha = lineAlphaFor(state.d2);
      animCtx.lineWidth = lineWidthFor(state.d2);
      for (var i = 1; i < state.d2; i++) {
        animCtx.beginPath();
        animCtx.moveTo(x, y + i * partH);
        animCtx.lineTo(x + fraction1W, y + i * partH);
        animCtx.stroke();
      }
      animCtx.restore();
    }

    var textX = x - 40;
    var textY = y + targetH / 2;
    animCtx.fillStyle = '#065F46';
    animCtx.font = '18px serif';
    animCtx.textAlign = 'center';
    animCtx.fillText(state.n2, textX, textY - 6);
    animCtx.beginPath();
    animCtx.strokeStyle = '#065F46';
    animCtx.lineWidth = 1.5;
    animCtx.moveTo(textX - 14, textY + 0);
    animCtx.lineTo(textX + 14, textY + 0);
    animCtx.stroke();
    animCtx.fillText(state.d2, textX, textY + 20);
  }

  function drawGlobalGrid() {
    var x = state.rect.x, y = state.rect.y, w = state.rect.w, h = state.rect.h;
    animCtx.save();
    animCtx.strokeStyle = '#94A3B8';
    animCtx.lineWidth = 1;
    animCtx.setLineDash([5, 5]);

    if (state.d2 > 1) {
      var partH = h / state.d2;
      animCtx.globalAlpha = lineAlphaFor(state.d2);
      for (var i = 1; i < state.d2; i++) {
        animCtx.beginPath();
        animCtx.moveTo(x, y + i * partH);
        animCtx.lineTo(x + w, y + i * partH);
        animCtx.stroke();
      }
    }
    if (state.d1 > 1) {
      var partW = w / state.d1;
      animCtx.globalAlpha = lineAlphaFor(state.d1);
      for (var j = 1; j < state.d1; j++) {
        animCtx.beginPath();
        animCtx.moveTo(x + j * partW, y);
        animCtx.lineTo(x + j * partW, y + h);
        animCtx.stroke();
      }
    }
    animCtx.restore();
  }

  function drawOverlap(showResult) {
    if (showResult === undefined) showResult = false;
    var x = state.rect.x, y = state.rect.y, w = state.rect.w, h = state.rect.h;
    var overlapW = (w / state.d1) * state.n1;
    var overlapH = (h / state.d2) * state.n2;

    animCtx.fillStyle = '#059669';
    animCtx.globalAlpha = 0.85;
    animCtx.fillRect(x, y, overlapW, overlapH);
    animCtx.globalAlpha = 1;

    animCtx.strokeStyle = '#F59E0B';
    animCtx.lineWidth = 4;
    animCtx.strokeRect(x, y, overlapW, overlapH);

    if (showResult) {
      var cx = x + overlapW / 2;
      var cy = y + overlapH / 2;
      var fontSize = 22;
      if (String(state.n1 * state.n2).length + String(state.d1 * state.d2).length > 6) {
        fontSize = 16;
      }
      animCtx.fillStyle = '#F59E0B';
      animCtx.font = 'bold ' + fontSize + 'px sans-serif';
      animCtx.textAlign = 'center';
      animCtx.fillText(state.n1 * state.n2, cx, cy - 6);
      animCtx.beginPath();
      animCtx.strokeStyle = '#F59E0B';
      animCtx.lineWidth = 2;
      animCtx.moveTo(cx - 18, cy + 0);
      animCtx.lineTo(cx + 18, cy + 0);
      animCtx.stroke();
      animCtx.fillText(state.d1 * state.d2, cx, cy + 20);
    }
  }

  /* ---------- 步骤定义 ---------- */
  var steps = [
    {
      hint: '首先，我们画一个大长方形，把它看作单位“1”。',
      render: function () { drawUnitSquare(0); }
    },
    {
      hint: function (s) {
        return '把单位“1”平均分成' + s.d1 + '份，取其中的' + s.n1 + '份，就是 ' + fracHTML(s.n1, s.d1) + '。';
      },
      render: function () { drawUnitSquare(1); drawFraction1(); }
    },
    {
      hint: function (s) {
        return '把刚才涂色的 ' + fracHTML(s.n1, s.d1) + ' 部分看作一个新的整体，平均分成 ' + s.d2 + ' 份，取其中的 ' + s.n2 + ' 份。';
      },
      render: function () { drawUnitSquare(1); drawFraction1(1); drawFraction2(); }
    },
    {
      hint: '看！重叠的部分就是结果。为了看清它占整个单位“1”的几分之几，我们把整个正方形都用虚线分一分。',
      render: function () {
        drawUnitSquare(1);
        drawFraction1(0.3);
        drawFraction2(0.3);
        drawGlobalGrid();
        drawOverlap();
      }
    },
    {
      hint: function (s) {
        return '分子相乘：' + s.n1 + '×' + s.n2 + '=' + (s.n1 * s.n2) +
               '；分母相乘：' + s.d1 + '×' + s.d2 + '=' + (s.d1 * s.d2) +
               '。结果是 ' + fracHTML(s.n1 * s.n2, s.d1 * s.d2) + '。';
      },
      render: function () {
        drawUnitSquare(1);
        drawFraction1(0.1);
        drawFraction2(0.1);
        drawGlobalGrid();
        drawOverlap(true);
      }
    }
  ];

  function renderStep(idx) {
    animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);
    steps[idx].render();

    var hint = typeof steps[idx].hint === 'function' ? steps[idx].hint(state) : steps[idx].hint;
    hintBox.querySelector('p').innerHTML = hint;
    hintBox.classList.add('visible');

    document.querySelectorAll('.step-btn').forEach(function (btn) {
      btn.classList.toggle('active', parseInt(btn.dataset.step, 10) === idx);
    });

    var formulaHTML = fracHTML(state.n1, state.d1) +
      ' <span style="font-size:18px;color:#FB923C;font-weight:800">×</span> ' +
      fracHTML(state.n2, state.d2) + ' <span style="color:#9CA3AF">=</span> ';
    if (idx === 4) {
      formulaHTML += fracHTML(state.n1 * state.n2, state.d1 * state.d2);
    } else {
      formulaHTML += '<span style="color:#3B82F6;font-weight:800">?</span>';
    }
    formulaDisplay.innerHTML = formulaHTML;
  }

  /* ---------- 进度动画 ---------- */
  var animToken = 0;
  function animateProgress(prop, duration, onUpdate) {
    var myToken = ++animToken;
    var start = performance.now();
    function tick(now) {
      if (myToken !== animToken) return;
      var t = Math.min((now - start) / duration, 1);
      var e = 1 - (1 - t) * (1 - t);
      state[prop] = e;
      onUpdate();
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function goToStep(idx) {
    state.currentStep = idx;
    animToken++;

    state.progress1 = (idx >= 1) ? (idx === 1 ? 0 : 1) : 0;
    state.progress2 = (idx >= 2) ? (idx === 2 ? 0 : 1) : 0;

    if (idx === 1) {
      animateProgress('progress1', 1200, function () { renderStep(idx); });
    } else if (idx === 2) {
      animateProgress('progress2', 1200, function () { renderStep(idx); });
    } else {
      renderStep(idx);
    }
  }

  /* ---------- 绑定事件 ---------- */
  document.querySelectorAll('.step-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      goToStep(parseInt(btn.dataset.step, 10));
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    var n1 = parseInt(num1El.value, 10); if (isNaN(n1)) n1 = 1;
    var d1 = parseInt(den1El.value, 10); if (isNaN(d1)) d1 = 2;
    var n2 = parseInt(num2El.value, 10); if (isNaN(n2)) n2 = 1;
    var d2 = parseInt(den2El.value, 10); if (isNaN(d2)) d2 = 4;

    state.n1 = Math.max(MIN_NUM, Math.min(MAX_NUM, n1));
    state.d1 = Math.max(MIN_DEN, Math.min(MAX_DEN, d1));
    state.n2 = Math.max(MIN_NUM, Math.min(MAX_NUM, n2));
    state.d2 = Math.max(MIN_DEN, Math.min(MAX_DEN, d2));

    num1El.value = String(state.n1);
    den1El.value = String(state.d1);
    num2El.value = String(state.n2);
    den2El.value = String(state.d2);

    goToStep(0);
  });

  document.getElementById('audioBtn').addEventListener('click', function () {
    if (audio.paused) audio.play().catch(function () {});
    else audio.pause();
  });

  /* ---------- 启动 ---------- */
  resize();
  setTimeout(function () { goToStep(0); }, 300);
})();
</script>
</body>
</html>
