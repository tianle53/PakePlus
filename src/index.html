&lt;div class=&quot;app&quot;&gt;
  &lt;header class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;brand&quot;&gt;&lt;div class=&quot;brand-mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;h1&gt;圆的常用量记忆赛&lt;/h1&gt;&lt;p class=&quot;subtitle&quot;&gt;西师版六年级上册数学 &middot; 三人同屏闯关&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;top-tools&quot;&gt;&lt;div class=&quot;mini-badge&quot;&gt;题库 &lt;strong&gt;103&lt;/strong&gt; 题&lt;/div&gt;&lt;div class=&quot;mini-badge&quot;&gt;前两关 &lt;strong&gt;15&lt;/strong&gt; 秒&lt;/div&gt;&lt;div class=&quot;mini-badge&quot;&gt;第三关 &lt;strong&gt;60&lt;/strong&gt; 秒&lt;/div&gt;&lt;/div&gt;

    &lt;section id=&quot;introScreen&quot; class=&quot;screen active&quot;&gt;
      &lt;div class=&quot;intro-grid&quot;&gt;
        &lt;div class=&quot;panel hero&quot;&gt;
          &lt;div class=&quot;hero-graphic&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;question-meta&quot;&gt;CLASSROOM MEMORY CHALLENGE&lt;/div&gt;
          &lt;h2&gt;把圆的常用量，&lt;span&gt;记成闪电速度&lt;/span&gt;&lt;/h2&gt;
          &lt;p&gt;三位同学同时答题，比一比谁能更快记住圆周率倍数、完全平方数、圆面积 &pi; 倍表以及圆的面积和周长公式。答对得分，答错看提示，累计积分解锁魔法圆环奖励。&lt;/p&gt;
          &lt;div class=&quot;rules&quot;&gt;
            &lt;div class=&quot;rule&quot;&gt;&lt;strong&gt;01&lt;/strong&gt;&lt;span&gt;每关随机抽取 10 题，三个难度梯度逐级开放。&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;rule&quot;&gt;&lt;strong&gt;02&lt;/strong&gt;&lt;span&gt;前两关每题共享 15 秒倒计时；第三关为 1 分钟 4&times;4 连连看。&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;rule&quot;&gt;&lt;strong&gt;03&lt;/strong&gt;&lt;span&gt;本关每位同学最高 100 分，答错可打开知识点小卡片复习。&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;start-zone&quot;&gt;&lt;button id=&quot;startBtn&quot; class=&quot;primary-btn&quot;&gt;开始第 1 关&lt;/button&gt;&lt;span class=&quot;subtitle&quot; style=&quot;margin:0&quot;&gt;也可在右侧直接选择任意关卡&lt;/span&gt;&lt;button id=&quot;howBtn&quot; class=&quot;secondary-btn&quot;&gt;查看玩法&lt;/button&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;panel&quot;&gt;
          &lt;h2 class=&quot;level-title&quot;&gt;闯关路线&lt;/h2&gt;
          &lt;p class=&quot;subtitle&quot;&gt;先从基础识记开始，再挑战判断与综合辨析。&lt;/p&gt;
          &lt;div class=&quot;level-list&quot; aria-label=&quot;选择闯关关卡&quot;&gt;
            &lt;div class=&quot;level-card active-level&quot;&gt;&lt;div&gt;&lt;div class=&quot;level-name&quot;&gt;第 1 关 &middot; 圆周率与平方数&lt;/div&gt;&lt;div class=&quot;level-desc&quot;&gt;直接识记：&pi; 的倍数、完全平方数、基础面积倍表。&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;difficulty-btn level-choice&quot; type=&quot;button&quot; data-level=&quot;1&quot;&gt;选择第1关&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;level-card&quot;&gt;&lt;div&gt;&lt;div class=&quot;level-name&quot;&gt;第 2 关 &middot; 判断与辨析&lt;/div&gt;&lt;div class=&quot;level-desc&quot;&gt;相近数字干扰，判断等式与常用量是否正确。&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;difficulty-btn level-choice&quot; type=&quot;button&quot; data-level=&quot;2&quot;&gt;选择第2关&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;level-card&quot;&gt;&lt;div&gt;&lt;div class=&quot;level-name&quot;&gt;第 3 关 &middot; 4&times;4魔法连连看&lt;/div&gt;&lt;div class=&quot;level-desc&quot;&gt;60秒内翻开16张记忆卡，配对圆周率、平方数、面积表和公式。&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;difficulty-btn level-choice&quot; type=&quot;button&quot; data-level=&quot;3&quot;&gt;选择第3关&lt;/button&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div style=&quot;margin-top:22px;border-top:1px solid var(--border);padding-top:16px;line-height:1.7;font-size:14px;color:var(--muted)&quot;&gt;&lt;strong style=&quot;color:var(--ink)&quot;&gt;课堂提示&lt;/strong&gt;&lt;br&gt;建议三位同学分别坐在屏幕左、中、右位置。前两关按题目作答，第三关点击两张卡片进行配对，教师可随时使用暂停键。&lt;/div&gt;

      &lt;div class=&quot;players&quot; id=&quot;players&quot;&gt;&lt;/div&gt;

&lt;div id=&quot;tipModal&quot; class=&quot;modal-backdrop&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;tipTitle&quot;&gt;&lt;div class=&quot;modal&quot;&gt;&lt;h3 id=&quot;tipTitle&quot;&gt;知识点小卡片&lt;/h3&gt;&lt;p id=&quot;tipText&quot;&gt;&lt;/p&gt;&lt;div class=&quot;modal-answer&quot; id=&quot;tipAnswer&quot;&gt;&lt;/div&gt;&lt;button id=&quot;closeTipBtn&quot; class=&quot;primary-btn&quot;&gt;我记住了&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div id=&quot;howModal&quot; class=&quot;modal-backdrop&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;howTitle&quot;&gt;&lt;div class=&quot;modal&quot;&gt;&lt;h3 id=&quot;howTitle&quot;&gt;玩法说明&lt;/h3&gt;&lt;p&gt;教师点击开始后，三位同学同时进入闯关。第一、二关每题有15秒共享倒计时；第三关是1分钟4&times;4连连看，点击两张卡片进行知识配对。&lt;/p&gt;&lt;p&gt;前两关每答对一题得10分，第三关每成功配对一组得10分。答错时可查看知识点小卡片，达到30、60、90分会点亮奖励圆环。&lt;/p&gt;&lt;button id=&quot;closeHowBtn&quot; class=&quot;primary-btn&quot;&gt;开始挑战&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div id=&quot;pauseOverlay&quot; class=&quot;modal-backdrop&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;pauseTitle&quot;&gt;&lt;div class=&quot;modal pause-modal&quot;&gt;&lt;h3 id=&quot;pauseTitle&quot;&gt;魔法时间暂停&lt;/h3&gt;&lt;p&gt;倒计时已经停住，三位同学可以整理思路。准备好后点击继续，剩余时间会从刚才的位置接着走。&lt;/p&gt;&lt;div class=&quot;fairy-ribbon&quot;&gt;&lt;/div&gt;&lt;button id=&quot;resumeBtn&quot; class=&quot;primary-btn&quot; type=&quot;button&quot; style=&quot;margin-top:18px&quot;&gt;继续游戏&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const PI = {1:3.14,2:6.28,3:9.42,4:12.56,5:15.70,6:18.84,7:21.98,8:25.12,9:28.26,10:31.40,11:34.54,12:37.68,16:50.24,18:56.52,20:62.80,25:78.50,32:100.48,36:113.04,49:153.86,64:200.96,81:254.34,121:379.94};
  const SQUARE = {}; for(let i=1;i&lt;=20;i++) SQUARE[i]=i*i;
  const CUBE = {}; for(let i=1;i&lt;=20;i++) CUBE[i]=i*i*i;
  const AREA_PI = {}; for(let i=1;i&lt;=20;i++) AREA_PI[i]=Number((i*i*3.14).toFixed(2));
  const piKeys = Object.keys(PI).map(Number), squareKeys=Object.keys(SQUARE).map(Number), areaKeys=Object.keys(AREA_PI).map(Number), cubeKeys=Object.keys(CUBE).map(Number);
  const players = [{name:'一号选手',score:0,totalTime:0,lastTime:null,answered:false,correct:0,rewardLevel:0},{name:'二号选手',score:0,totalTime:0,lastTime:null,answered:false,correct:0,rewardLevel:0},{name:'三号选手',score:0,totalTime:0,lastTime:null,answered:false,correct:0,rewardLevel:0}];
  const difficultyNames={1:'基础识记',2:'判断辨析',3:'4&times;4魔法连连看'};
  const state={phase:'intro',level:1,questionIndex:0,questions:[],startedAt:0,timeLeft:15,timerId:null,advanceId:null,roundScores:[0,0,0],unlocked:1,seed:Date.now(),matchBoards:[]};

  const $ = id =&gt; document.getElementById(id);
  const introScreen=$('introScreen'), gameScreen=$('gameScreen'), resultScreen=$('resultScreen');
  const playersEl=$('players');
  const clamp=(n,min,max)=&gt;Math.max(min,Math.min(max,n));
  function hashSeed(str){let h=2166136261;for(let i=0;i&lt;str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h&gt;&gt;&gt;0}
  function rng(seed){let x=seed&gt;&gt;&gt;0;return()=&gt;{x=Math.imul(1664525,x)+1013904223;return (x&gt;&gt;&gt;0)/4294967296}}
  function shuffled(list,random){const a=list.slice();for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function pick(arr,random){return arr[Math.floor(random()*arr.length)]}
  function fmt(n){return Number(n).toFixed(2)}
  function formula(text){return `\\(${text}\\)`}
  function normalDistractors(correct, source, random, count=3){const set=new Set([String(correct)]);const candidates=[];for(const x of source){if(String(x)!==String(correct)) candidates.push(x)}for(const x of shuffled(candidates,random)){if(set.size&gt;=count+1)break;set.add(String(x))}return Array.from(set).slice(0,count+1)}
  function choiceQuestion(text,answer,options,tip,level,tag){return {type:'choice',text,answer:String(answer),options:options.map(String),tip,level,tag}}
  function getTimeLimit(level){return level===3?60:15}
  function buildMatchCards(random){const pairs=[
    {pair:'pi4',display:formula('4\\pi')},{pair:'pi4',display:'12.56'},
    {pair:'sq5',display:formula('5^2')},{pair:'sq5',display:'25'},
    {pair:'area5',display:formula('5^2\\pi')},{pair:'area5',display:'78.50'},
    {pair:'circ',display:formula('C=2\\pi r')},{pair:'circ',display:'圆的周长'},
    {pair:'area',display:formula('S=\\pi r^2')},{pair:'area',display:'圆的面积'},
    {pair:'pi2',display:formula('2\\pi')},{pair:'pi2',display:'6.28'},
    {pair:'sq10',display:formula('10^2')},{pair:'sq10',display:'100'},
    {pair:'pi10',display:formula('10\\pi')},{pair:'pi10',display:'31.40'}
  ];return shuffled(pairs,random).map((card,index)=&gt;({...card,id:`m${index}`}))}
  function setupMatchBoards(){const random=rng(hashSeed(`${state.seed}-match-${Date.now()}`));state.matchBoards=players.map(()=&gt;({cards:buildMatchCards(random),selected:[],matched:[],pairCount:0,wrongTimer:null,complete:false}));}
  function judgeQuestion(text,answer,tip,level,tag,correctStatement){return {type:'judge',text,answer:String(answer),options:['正确','错误'],tip,level,tag,correctStatement}}
  function buildQuestionBank(){
    const bank=[[],[],[],[]]; const random=rng(hashSeed('circle-memory-bank-v1'));
    // Level 1: 34 direct memory questions.
    for(let i=0;i&lt;12;i++){const r=piKeys[i%piKeys.length], val=Number((2*r*3.14).toFixed(2)); const circumferenceSource=piKeys.map(n=&gt;Number((2*n*3.14).toFixed(2))); const opts=normalDistractors(val,circumferenceSource,random,3); bank[1].push(choiceQuestion(`已知半径为 ${formula('r='+r)}，对应的 ${formula('2\\pi r')} 数值是？`,val,opts,`圆的周长公式是 ${formula('C=2\\pi r')}。当 ${formula('r='+r)} 时，${formula('C=2\\pi\\times '+r+'='+fmt(val))}。`,1,'pi'))}
    for(let i=0;i&lt;10;i++){const n=(i%20)+1,val=SQUARE[n];const opts=normalDistractors(val,Object.values(SQUARE),random,3);bank[1].push(choiceQuestion(`${formula(n+'^2')} 的结果是？`,val,opts,`完全平方数表示相同数相乘：${formula(n+'^2='+n+'\\times '+n+'='+val)}。`,1,'square'))}
    for(let i=0;i&lt;12;i++){const r=(i%20)+1,val=AREA_PI[r];const opts=normalDistractors(val,Object.values(AREA_PI),random,3);bank[1].push(choiceQuestion(`圆的半径是 ${formula('r='+r)}，这个圆的面积约是多少？（&pi; 取 3.14）`,val,opts,`圆面积公式是 ${formula('S=\\pi r^2')}，所以 ${formula('S='+r+'^2\\pi='+fmt(val))}。`,1,'area'))}
    const formulaQuestions=[
      {text:`圆的周长公式是？`,answer:'C=2\\pi r',options:['C=2\\pi r','C=\\pi r^2','C=\\pi d^2','C=r^2'],tip:`圆的周长可以用半径表示为 ${formula('C=2\\pi r')}。`,tag:'formula'},
      {text:`如果已知圆的直径，圆的周长公式应选哪一个？`,answer:'C=\\pi d',options:['C=\\pi d','C=2\\pi r^2','C=d^2','C=\\pi r'],tip:`知道直径时，圆周长公式是 ${formula('C=\\pi d')}；知道半径时才常写成 ${formula('C=2\\pi r')}。`,tag:'formula'},
      {text:`圆的面积公式是？`,answer:'S=\\pi r^2',options:['S=\\pi r^2','S=2\\pi r','S=\\pi d','S=r^2'],tip:`圆面积要用半径的平方乘圆周率：${formula('S=\\pi r^2')}。`,tag:'formula'}
    ];
    formulaQuestions.forEach(item=&gt;bank[1].push({...choiceQuestion(item.text,item.answer,item.options,item.tip,1,item.tag),mathOptions:true}));
    // Level 2: 33 judgement questions.
    for(let i=0;i&lt;11;i++){const r=piKeys[(i+5)%piKeys.length],val=PI[r],truth=i%2===0;const shown=truth?val:(val+(i%3+1)*0.02);bank[2].push(judgeQuestion(`${formula(r+'\\pi')} 是否等于 ${formula(fmt(shown))}？`,truth?'正确':'错误',`圆周率倍数表中的对应项是 ${formula(r+'\\pi='+fmt(val))}。小数点后两位要看清楚。`,2,'pi',truth?`正确：${formula(r+'\\pi='+fmt(val))}`:`错误：应为 ${formula(r+'\\pi='+fmt(val))}`))}
    for(let i=0;i&lt;11;i++){const n=(i+4)%20+1,val=SQUARE[n],truth=i%2===1;const shown=truth?val:val+(i%3+1);bank[2].push(judgeQuestion(`${formula(n+'^2')} 是否等于 ${formula(String(shown))}？`,truth?'正确':'错误',`完全平方数要用 ${formula(n+'\\times '+n)} 核对。${formula(n+'^2='+val)}。`,2,'square',truth?`正确：${formula(n+'^2='+val)}`:`错误：应为 ${formula(n+'^2='+val)}`))}
    for(let i=0;i&lt;11;i++){const r=(i+1)%20+1,val=AREA_PI[r],truth=i%2===0;const shown=truth?val:val+(i%3+1)*3.14;bank[2].push(judgeQuestion(`半径为 ${formula('r='+r)} 的圆，面积 ${formula('S')} 是否为 ${formula(fmt(shown))}？`,truth?'正确':'错误',`使用 ${formula('S=\\pi r^2')}，查表可得 ${formula(r+'^2\\pi='+fmt(val))}。`,2,'area',truth?`正确：${formula('S='+fmt(val))}`:`错误：应为 ${formula('S='+fmt(val))}`))}
    // Level 3: 33 mixed rapid questions.
    for(let i=0;i&lt;11;i++){const r=piKeys[(i*2+2)%piKeys.length],val=PI[r];const opts=normalDistractors(val,Object.values(PI),random,3);bank[3].push(choiceQuestion(`圆的周长计算中，若直径为 ${formula('d='+r)}，${formula('\\pi d')} 的常用值是？`,val,opts,`圆周长可用 ${formula('C=\\pi d')}，当 ${formula('d='+r)} 时，直接查 ${formula(r+'\\pi='+fmt(val))}。`,3,'mixed'))}
    for(let i=0;i&lt;11;i++){const n=(i*2)%20+1,val=SQUARE[n];const opts=normalDistractors(val,Object.values(SQUARE),random,3);bank[3].push(choiceQuestion(`圆面积中出现 ${formula('r^2')}。当 ${formula('r='+n)} 时，${formula('r^2')} 应取哪一个值？`,val,opts,`先求平方数：${formula('r^2='+n+'^2='+val)}，再乘以 &pi;。`,3,'mixed'))}
    for(let i=0;i&lt;11;i++){const r=(i*2+3)%20+1,val=AREA_PI[r];const opts=normalDistractors(val,Object.values(AREA_PI),random,3);bank[3].push(choiceQuestion(`快速记忆：${formula('r='+r)} 时，圆面积的查表值 ${formula(r+'^2\\pi')} 是多少？`,val,opts,`圆面积表把 ${formula(r+'^2\\pi')} 预先算好了，答案是 ${formula(r+'^2\\pi='+fmt(val))}。`,3,'mixed'))}
    return bank;
  }
  const bank=buildQuestionBank();
  const totalBank=bank[1].length+bank[2].length+bank[3].length;
  const formulaQuestionCount=bank.flat().filter(q=&gt;q.tag==='formula').length;
  function verifyBank(){return totalBank===103 &amp;&amp; formulaQuestionCount===3 &amp;&amp; bank[1].length===37 &amp;&amp; bank[2].length===33 &amp;&amp; bank[3].length===33}

  function setScreen(name){[introScreen,gameScreen,resultScreen].forEach(s=&gt;s.classList.remove('active'));$(name+'Screen').classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
  async function typeset(root){if(!root)return;try{await MathJax.startup.promise; if(root.textContent.trim()){MathJax.typesetClear([root]);await MathJax.typesetPromise([root]);}}catch(err){console.error('MathJax typeset failed',err);window.__interactionState.mathJaxError=String(err)}}
  function updateState(action,payload={}){
    if(action==='START'){clearTimeout(state.advanceId);state.phase='playing';state.level=payload.level||1;state.questionIndex=0;state.questions=state.level===3?[]:selectQuestions(state.level);state.startedAt=performance.now();state.timeLeft=getTimeLimit(state.level);state.roundScores=[0,0,0];players.forEach(p=&gt;{p.score=0;p.totalTime=0;p.lastTime=null;p.answered=false;p.correct=0;p.rewardLevel=0});if(state.level===3)setupMatchBoards();else state.matchBoards=[];$('pauseOverlay').classList.remove('show');setScreen('game');renderGame();startTimer();}
    if(action==='PAUSE'){if(state.phase!=='playing')return;clearInterval(state.timerId);state.phase='paused';$('pauseOverlay').classList.add('show');renderGame();}
    if(action==='RESUME'){if(state.phase!=='paused')return;state.phase='playing';$('pauseOverlay').classList.remove('show');renderGame();startTimer();}
    if(action==='ANSWER'){if(state.level===3)return;const p=players[payload.player];if(state.phase!=='playing'||p.answered)return;p.answered=true;p.lastTime=Math.max(0,getTimeLimit(state.level)-state.timeLeft);p.totalTime+=p.lastTime;const q=state.questions[state.questionIndex];const correct=String(payload.answer)===String(q.answer);if(correct){p.score+=10;p.correct+=1;state.roundScores[payload.player]=p.score;maybeReward(payload.player)}renderGame();if(correct){playSound('correct');playFeedbackVoice('correct')}else{playSound('wrong');playFeedbackVoice('wrong')}if(allAnswered())scheduleAdvance();}
    if(action==='MATCH_CLICK'){if(state.level!==3||state.phase!=='playing')return;const board=state.matchBoards[payload.player];if(!board||board.complete||board.resolving||board.matched.includes(payload.cardId)||board.selected.includes(payload.cardId))return;board.selected.push(payload.cardId);if(board.selected.length===2){const first=board.cards.find(c=&gt;c.id===board.selected[0]);const second=board.cards.find(c=&gt;c.id===board.selected[1]);if(first.pair===second.pair){board.matched.push(first.id,second.id);board.selected=[];board.pairCount+=1;players[payload.player].score+=10;players[payload.player].correct=board.pairCount;maybeReward(payload.player);playSound('correct');playFeedbackVoice('correct');if(board.pairCount===8){board.complete=true;players[payload.player].totalTime=getTimeLimit(3)-state.timeLeft;}if(state.matchBoards.every(b=&gt;b.complete)){renderGame();finishRound();return}}else{const wrongIds=board.selected.slice();board.resolving=true;wrongIds.forEach(id=&gt;{const card=board.cards.find(c=&gt;c.id===id);if(card)card.wrongFlash=true});playSound('wrong');playFeedbackVoice('wrong');setTimeout(()=&gt;{wrongIds.forEach(id=&gt;{const card=board.cards.find(c=&gt;c.id===id);if(card)card.wrongFlash=false});board.selected=[];board.resolving=false;renderGame()},520)}}renderGame();}
    if(action==='TIME_UP'){if(state.phase!=='playing')return;state.timeLeft=0;if(state.level===3){state.matchBoards.forEach((board,i)=&gt;{if(!board.complete)players[i].totalTime=getTimeLimit(3);board.complete=true});playFeedbackVoice('wrong');finishRound();return}players.forEach(p=&gt;{if(!p.answered){p.answered=true;p.lastTime=getTimeLimit(state.level);p.totalTime+=p.lastTime;}});renderGame();playSound('wrong');playFeedbackVoice('wrong');scheduleAdvance(900);}
    if(action==='NEXT'){if(state.phase!=='playing'||state.level===3)return;clearTimeout(state.advanceId);state.questionIndex+=1;if(state.questionIndex&gt;=10){finishRound();return}players.forEach(p=&gt;{p.answered=false;p.lastTime=null});state.timeLeft=getTimeLimit(state.level);renderGame();startTimer();}
    if(action==='RESET'){clearInterval(state.timerId);clearTimeout(state.advanceId);$('pauseOverlay').classList.remove('show');state.matchBoards=[];state.phase='intro';setScreen('intro');}
  }
  function selectQuestions(level){const random=rng(hashSeed(`${state.seed}-${level}-${Date.now()}`));const source=bank[level];if(level===1){const formulaPool=source.filter(q=&gt;q.tag==='formula');const otherPool=source.filter(q=&gt;q.tag!=='formula');const required=pick(formulaPool,random);return shuffled([required,...shuffled(otherPool,random).slice(0,9)],random)}return shuffled(source,random).slice(0,10)}
  function allAnswered(){return players.every(p=&gt;p.answered)}
  function startTimer(){clearInterval(state.timerId);state.startedAt=performance.now();state.timerId=setInterval(()=&gt;{if(state.phase!=='playing'){clearInterval(state.timerId);return}state.timeLeft=Math.max(0,state.timeLeft-.1);$('timer').textContent=state.timeLeft.toFixed(1);$('timer').classList.toggle('warning',state.timeLeft&lt;=3);if(state.timeLeft&lt;=0){clearInterval(state.timerId);updateState('TIME_UP')}},100)}
  function scheduleAdvance(delay=1200){clearInterval(state.timerId);clearTimeout(state.advanceId);$('roundMessage').textContent='本题结算中，下一题即将出现&hellip;&hellip;';state.advanceId=setTimeout(()=&gt;updateState('NEXT'),delay)}
  function maybeReward(i){const p=players[i];const next=Math.floor(p.score/30);if(next&gt;p.rewardLevel){p.rewardLevel=next;showToast(`${p.name} 解锁了第 ${next} 级圆环奖励`);playSound('reward')}}
  function renderGame(){
    $('levelLabel').textContent=`第${state.level}关`;$('difficultyLabel').textContent=difficultyNames[state.level];$('timer').textContent=state.timeLeft.toFixed(1);$('timer').classList.toggle('warning',state.timeLeft&lt;=3);$('pauseBtn').textContent=state.phase==='paused'?'已暂停':'暂停';$('pauseBtn').disabled=!(state.phase==='playing'||state.phase==='paused');$('bankLabel').textContent=state.level===3?'每人16张卡片':`题库 ${totalBank} 题`;
    if(state.level===3){const maxPairs=Math.max(0,...state.matchBoards.map(b=&gt;b.pairCount));$('progressLabel').textContent=`已配对 ${maxPairs} / 8 组`;$('progressFill').style.width=`${(maxPairs/8)*100}%`;$('questionType').textContent='4&times;4连连看';$('questionText').innerHTML='请在自己的卡片区内点击两张卡片，配对圆的常用量与对应知识。';playersEl.innerHTML=players.map((p,i)=&gt;renderMatchPlayer(p,i)).join('');$('roundMessage').textContent=state.phase==='paused'?'游戏已暂停，三位同学的卡片已锁定。':'点击两张卡片进行配对；每成功一组得10分。';renderRewards();typeset($('questionText'));typeset(playersEl);return}
    const q=state.questions[state.questionIndex];if(!q)return;$('progressLabel').textContent=`第 ${state.questionIndex+1} / 10 题`;$('progressFill').style.width=`${(state.questionIndex/10)*100}%`;$('questionType').textContent=q.type==='choice'?'选择题':'判断题';$('questionText').innerHTML=q.text;playersEl.innerHTML=players.map((p,i)=&gt;renderPlayer(p,i,q)).join('');const msg=state.phase==='paused'?'游戏已暂停，点击&ldquo;继续游戏&rdquo;恢复倒计时。':allAnswered()?'三位同学都已作答，正在核对答案&hellip;&hellip;':'请选择答案；每位同学的答题会独立计分。';$('roundMessage').textContent=msg;renderRewards();typeset($('questionText'));typeset(playersEl)
  }
  function renderPlayer(p,i,q){const answered=p.answered;const answerLocked=answered||state.phase==='paused';const answerButtons=q.options.map((op,idx)=&gt;{let cls='';if(answered&amp;&amp;String(op)===String(q.answer))cls='correct-answer';const shown=q.mathOptions?formula(op):op;return `&lt;button class=&quot;answer-btn ${cls}&quot; data-player=&quot;${i}&quot; data-answer=&quot;${escapeAttr(op)}&quot; ${answerLocked?'disabled':''}&gt;&lt;span class=&quot;option-index&quot;&gt;${String.fromCharCode(65+idx)}&lt;/span&gt;&lt;span&gt;${shown}&lt;/span&gt;&lt;/button&gt;`}).join('');let feedback='';if(answered){const lastAnswer=playerLastAnswers[i];const ok=String(lastAnswer)===String(q.answer);feedback=`&lt;div class=&quot;feedback ${ok?'correct':'wrong'}&quot;&gt;&lt;div class=&quot;feedback-title&quot;&gt;${ok?'答对了，+10 分':'答错了，正确答案已标出'}&lt;/div&gt;&lt;div&gt;${ok?'记忆速度很棒！':'别急，先看清楚对应的倍数、平方数或公式。'}&lt;/div&gt;&lt;div class=&quot;feedback-answer&quot;&gt;正确答案：${q.type==='judge'?q.answer:formula(q.answer)}&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:var(--muted)&quot;&gt;本题用时：${(p.lastTime??getTimeLimit(state.level)).toFixed(1)} 秒&lt;/div&gt;${!ok?`&lt;button class=&quot;tip-btn&quot; data-tip-player=&quot;${i}&quot;&gt;查看知识点小卡片&lt;/button&gt;`:''}&lt;/div&gt;`}else{feedback=`&lt;div class=&quot;feedback&quot;&gt;&lt;div class=&quot;feedback-title&quot;&gt;${state.phase==='paused'?'等待继续':'等待作答'}&lt;/div&gt;&lt;div&gt;${state.phase==='paused'?'暂停期间不能提交答案。':'倒计时结束前选择一个答案。'}&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:var(--muted)&quot;&gt;本题用时：&mdash;&lt;/div&gt;&lt;/div&gt;`}return `&lt;article class=&quot;player-card&quot; data-player=&quot;${i}&quot;&gt;&lt;div class=&quot;player-header&quot;&gt;&lt;div class=&quot;player-name&quot;&gt;${p.name}&lt;/div&gt;&lt;div class=&quot;player-score&quot;&gt;${p.score}&lt;span style=&quot;font-size:12px;font-weight:700&quot;&gt;分&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;player-info&quot;&gt;&lt;span&gt;累计用时 &lt;strong&gt;${p.totalTime.toFixed(1)}s&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;本题 &lt;strong&gt;${p.lastTime===null?'&mdash;':p.lastTime.toFixed(1)+'s'}&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;answer-area ${answerLocked?'disabled-layer':''}&quot;&gt;${answerButtons}&lt;/div&gt;${feedback}&lt;/article&gt;`}
  function renderMatchPlayer(p,i){const board=state.matchBoards[i];const locked=state.phase!=='playing'||board.complete||board.resolving;const cards=board.cards.map(card=&gt;{const selected=board.selected.includes(card.id),matched=board.matched.includes(card.id),wrong=card.wrongFlash;const cls=`match-card ${selected?'revealed':''} ${matched?'matched':''} ${wrong?'wrong-flash':''}`;return `&lt;button class=&quot;${cls}&quot; type=&quot;button&quot; data-match-player=&quot;${i}&quot; data-card-id=&quot;${card.id}&quot; ${locked||matched?'disabled':''} aria-label=&quot;${matched?'已配对':'记忆卡'}&quot;&gt;${card.display}&lt;/button&gt;`}).join('');const status=board.complete?'本区已完成配对':board.resolving?'正在核对这两张卡片':`已配对 ${board.pairCount} / 8 组`;return `&lt;article class=&quot;player-card&quot; data-player=&quot;${i}&quot;&gt;&lt;div class=&quot;player-header&quot;&gt;&lt;div class=&quot;player-name&quot;&gt;${p.name}&lt;/div&gt;&lt;div class=&quot;player-score&quot;&gt;${p.score}&lt;span style=&quot;font-size:12px;font-weight:700&quot;&gt;分&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;player-info&quot;&gt;&lt;span&gt;累计用时 &lt;strong&gt;${p.totalTime.toFixed(1)}s&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;配对 &lt;strong&gt;${board.pairCount}/8&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;match-area ${locked?'disabled-layer':''}&quot;&gt;${cards}&lt;/div&gt;&lt;div class=&quot;match-progress&quot;&gt;&lt;span&gt;${status}&lt;/span&gt;&lt;strong&gt;每组 +10 分&lt;/strong&gt;&lt;/div&gt;&lt;/article&gt;`}

  function renderRewards(){const marks=[30,60,90];$('rewardStrip').innerHTML=marks.map((m,idx)=&gt;{const unlocked=players.some(p=&gt;p.score&gt;=m);return `&lt;div class=&quot;reward-chip ${unlocked?'unlocked':''} ${state.questionIndex*10&lt;m?'current':''}&quot;&gt;奖励圆环 ${idx+1} &middot; ${m}分&lt;/div&gt;`}).join('')}
  function finishRound(){clearInterval(state.timerId);state.phase='result';state.unlocked=Math.max(state.unlocked,state.level+1);$('progressFill').style.width='100%';const sorted=players.map((p,i)=&gt;({...p,index:i})).sort((a,b)=&gt;b.score-a.score||a.totalTime-b.totalTime);const winner=sorted[0];$('resultTitle').textContent=`第 ${state.level} 关完成`;if(state.level===3){$('resultSummary').textContent=`4&times;4连连看结束。${winner.name} 以 ${winner.score} 分暂列第一，共完成 ${winner.correct} 组配对。`;$('scoreRows').innerHTML=sorted.map((p,rank)=&gt;`&lt;div class=&quot;result-row ${rank===0?'winner':''}&quot;&gt;&lt;div&gt;&lt;div class=&quot;result-main&quot;&gt;第 ${rank+1} 名 &middot; ${p.name}&lt;/div&gt;&lt;div class=&quot;result-sub&quot;&gt;成功配对 ${p.correct}/8 组 &middot; 连连看用时 ${p.totalTime.toFixed(1)} 秒&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;result-score&quot;&gt;${p.score}&lt;/div&gt;&lt;/div&gt;`).join('');}else{$('resultSummary').textContent=`本关共完成 10 题。${winner.name} 以 ${winner.score} 分暂列第一，下一关会加入更相近的干扰项和综合辨析。`;$('scoreRows').innerHTML=sorted.map((p,rank)=&gt;`&lt;div class=&quot;result-row ${rank===0?'winner':''}&quot;&gt;&lt;div&gt;&lt;div class=&quot;result-main&quot;&gt;第 ${rank+1} 名 &middot; ${p.name}&lt;/div&gt;&lt;div class=&quot;result-sub&quot;&gt;答对 ${p.correct}/10 题 &middot; 累计答题时间 ${p.totalTime.toFixed(1)} 秒&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;result-score&quot;&gt;${p.score}&lt;/div&gt;&lt;/div&gt;`).join('');}$('nextLevelBtn').textContent=state.level&lt;3?`进入第 ${state.level+1} 关`:'三关挑战完成';$('nextLevelBtn').disabled=state.level&gt;=3;$('nextLevelBtn').classList.toggle('hidden',state.level&gt;=3);setScreen('result');typeset($('resultSummary'));typeset($('scoreRows'));playSound('reward')}
